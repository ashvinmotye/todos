<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193546">
  <meta name="description" content="A focused, offline-first task list for the things that matter.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Focus Todo">
  <title>Focus Todo</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="header-copy">
        <span class="kicker">FOCUS TODO</span>
        <p id="greeting" class="profile-greeting">Hello 👋</p>
      </div>
      <div class="topbar-actions">
        <button id="themeButton" class="icon-btn" type="button" aria-label="Switch to light mode">
          <span id="themeIcon" aria-hidden="true">☀</span>
        </button>
        <button id="settingsButton" class="icon-btn" type="button" aria-label="Change your name"><span aria-hidden="true">⚙</span></button>
        <button id="installButton" class="icon-btn" type="button" aria-label="Install app" hidden><span aria-hidden="true">⇩</span></button>
      </div>
    </header>

    <main>
      <h1 class="sr-only">Focus Todo</h1>

      <section class="tasks-section" aria-label="Tasks">
        <div class="task-tabs" role="tablist" aria-label="Task lists">
          <button class="task-tab active" type="button" role="tab" data-filter="active" aria-selected="true">
            Active <b id="activeCount">0</b>
          </button>
          <button class="task-tab" type="button" role="tab" data-filter="completed" aria-selected="false">
            Completed <b id="completedCount">0</b>
          </button>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-mark" aria-hidden="true">✓</div>
          <h3>Your list is clear</h3>
          <p>Tap + to add something new.</p>
        </div>

        <ul id="taskList" class="task-list" aria-label="Todo tasks"></ul>

        <div id="boardFooter" class="board-footer" hidden>
          <button id="clearCompletedButton" class="clear-button" type="button" disabled>Clear completed</button>
        </div>
      </section>
    </main>

  </div>

  <button id="addTaskButton" class="orb-add" type="button" aria-label="Add a task">
    <span class="add-halos" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="add-core" aria-hidden="true">＋</span>
  </button>

  <div id="taskModal" class="modal" hidden>
    <button class="modal-backdrop" type="button" data-close-task-modal aria-label="Close task form"></button>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="taskFormTitle">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-head">
        <div>
          <span id="taskFormKicker" class="kicker">NEW MISSION</span>
          <h2 id="taskFormTitle">Add a task</h2>
        </div>
        <button id="closeTaskModalButton" class="icon-btn" type="button" aria-label="Close">×</button>
      </div>

      <form id="taskForm" novalidate>
        <input id="taskId" type="hidden">
        <div class="field">
          <label for="taskTitle">Task</label>
          <input id="taskTitle" name="title" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required>
          <p id="titleError" class="field-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="taskDescription">Notes <span class="optional">Optional</span></label>
          <textarea id="taskDescription" name="description" rows="3" maxlength="500" placeholder="Add useful details"></textarea>
        </div>
        <div class="form-grid">
          <div class="field date-field">
            <label for="taskDueDate">Due date</label>
            <input id="taskDueDate" name="dueDate" type="date">
          </div>
          <div class="field">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button id="cancelEditButton" class="secondary-btn" type="button" hidden>Cancel</button>
          <button id="submitButton" class="primary-btn" type="submit">Add task</button>
        </div>
      </form>
    </section>
  </div>

  <div id="nameModal" class="modal" hidden>
    <div class="modal-backdrop static"></div>
    <section class="modal-sheet name-sheet" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
      <div class="name-dialog-mark" aria-hidden="true">✓</div>
      <span class="kicker">WELCOME TO FOCUS</span>
      <h2 id="nameModalTitle">What should I call you?</h2>
      <p class="modal-intro">Your name personalizes Focus and stays on this device.</p>
      <form id="nameForm" novalidate>
        <div class="field">
          <label for="userName">Display name</label>
          <input id="userName" name="userName" type="text" maxlength="40" autocomplete="name" enterkeyhint="done" placeholder="Enter your name" required>
          <p id="nameError" class="field-error" role="alert"></p>
        </div>
        <button class="primary-btn wide" type="submit">Enter focus mode</button>
      </form>
    </section>
  </div>

  <template id="taskTemplate">
    <li class="task-card">
      <label class="check-control">
        <input class="task-checkbox" type="checkbox">
        <span class="checkmark" aria-hidden="true"></span>
        <span class="sr-only">Mark task complete</span>
      </label>
      <div class="task-content">
        <div class="task-title-row">
          <h3 class="task-title"></h3>
          <span class="priority-badge"></span>
        </div>
        <p class="task-description"></p>
        <div class="task-meta">
          <span class="due-date"></span>
          <span class="time-left-badge"></span>
        </div>
      </div>
      <div class="task-actions">
        <button class="mini-btn edit-button" type="button" aria-label="Edit task">Edit</button>
        <button class="mini-btn danger delete-button" type="button" aria-label="Delete task">Delete</button>
      </div>
    </li>
  </template>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
